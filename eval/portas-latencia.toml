# Portas de latência — R9.3
#
# Duas espécies, e a distinção é a correção que a medição faz no R9.3 original.
#
# [produto.p95]  — orçamento da experiência entregue no cenário de referência.
#                  Mede a operação completa; não impõe metas aos componentes.
#                  É diagnóstico, não move sozinho o código de saída.
#
# [regressao.<maquina>.p95] — o que aquela máquina fazia quando o piso foi
#                  medido, mais margem. É a porta que vale agora e a única que
#                  pode falhar por culpa de alguém: `--porta` sai com 1.
#
# Uma porta absoluta por componente não funcionou: 100 ms de BM25 e 150 ms de
# ANN não derivavam de uma necessidade do usuário e não garantiam 300 ms no
# total. Em 04/09/2026 foram substituídas por um orçamento fim a fim.
#
# **Os limites moram numa tabela `p95` própria, e a descrição da máquina fora
# dela.** Não é arrumação: com tudo no mesmo nível, `indice_chunks = 98326` fica
# indistinguível de um limite de 98 segundos para uma operação chamada
# `indice_chunks`. Uma linha que nunca dispara parece cobertura e não é — foi o
# que a suíte pegou em 24/08/2026, dez minutos depois de o arquivo existir.
#
# Chave = nome da operação em `eval/latencia.py` OPERACOES; porta de operação
# desconhecida é recusada por `eval/test_latencia.py`.
#
# Raciocínio completo e as medições: docs/porta-de-latencia.md

[produto]
origem = "docs/porta-de-latencia.md, reavaliação arquitetural de 04/09/2026"
alvo = "search MCP sem rerank, CPU de 4 núcleos e 8 GB, índice de estresse com 1M+ trechos"

[produto.p95]
# 3 404 ms medidos em 30 chamadas; 4 s preserva ~15% de margem. É provisório
# até existir corpus de escala representativo e telemetria de uso, não uma
# promessa universal de UX.
search = 4000
read_note = 100
neighbors = 100

# `overview` tem porta de 200 ms no dossiê e **não existe** — é R7.1, onda 7.
# Não entra aqui: porta de ferramenta ausente mede zero e reporta aprovado.


[regressao.desktop-980ti]
descricao = "i7 Haswell, 8 fios, Windows 11, CPU; duas 980 Ti presentes, passada com PROVIDER=cpu"
medido_em = "2026-09-02"
indice_chunks = 1000000
protocolo = "dourado sintético (perguntas.example.jsonl), um braço por passada, 3 descartadas no aquecimento, 3 passadas independentes"
margem = "1,15x o pior p95 de 3 passadas independentes; ver docs/porta-de-latencia.md"

[regressao.desktop-980ti.p95]
# Medido search p95: 7 402, 8 039, 7 632 ms (n=30 cada). Pior 8 039.
# 1,15x = 9 245; arredondado para baixo, para 9 200.
search = 9200
# Guarda de classe, como no notebook: p95 sub-milissegundo a ~1 ms.
read_note = 50

[regressao.notebook-15w]
descricao = "i7-1355U, 15 W, 12 fios (10 para a busca), CPU, sem GPU"
medido_em = "2026-08-24"
indice_chunks = 98326
protocolo = "conjunto dourado corporativo, um braço por passada, 3 descartadas no aquecimento"
margem = "1,15x o pior p95 de 3 passadas independentes; ver docs/porta-de-latencia.md"

[regressao.notebook-15w.p95]
# Medido: p95 2 713 ms (n=186) e 2 877 ms (n=186) em passadas independentes.
# 1,15x o pior = 3 309; arredondado para baixo, para 3 300.
search = 3300

# Medido: p95 11 331 ms (n=62), 10 candidatos — o que a base serve.
"search+rerank" = 13000

# Estes dois são **guarda de classe**, não detector fino de regressão: a p95 dos
# dois é sub-milissegundo, e nessa escala o ruído do sistema operacional é maior
# que qualquer sinal. Um piso apertado piscaria vermelho por escalonamento de
# processo. O que 50 ms pega é o que importa aqui — uma mudança que troque a
# consulta indexada por varredura, que custaria ordens de grandeza e não por
# cento. Medido: read_note p95 0,9 ms, neighbors p95 2,1 ms.
read_note = 50
neighbors = 50
