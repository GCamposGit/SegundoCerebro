name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Q1: ruff config is in pyproject.toml. Without this job two agents on
  # two machines lint with whatever they have installed, and the noqas
  # become cargo cult.
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install ruff
        run: pip install ruff==0.16.5
      - name: ruff check
        run: python -m ruff check src tests eval

  types:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package and pyright
        run: pip install -e . ; pip install pyright==1.1.411
      - name: pyright
        run: python -m pyright src

  pytest:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package from lock
        # Q2: lock first, then the editable package without resolving again.
        # install-smoke still uses `pip install -e .` (pyproject, 3 OSes).
        run: pip install -r requirements.txt ; pip install -e . --no-deps ; pip install pytest-cov

      - name: Run test suite
        # Floor is measured, then −2 p.p. (Q1). Do not raise it toward 100.
        run: python -m pytest tests/ eval/ -q --cov=segundocerebro --cov-report=xml --cov-fail-under=80

  # FND-09a: the layperson path is the wheel, not `pip install -e .`.
  # Full pytest stays on Windows. This job builds a wheel, installs it in a
  # venv outside the checkout, and runs scripts/smoke_wheel.py.
  install-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Build wheel
        run: python -m pip wheel --no-deps -w "${{ runner.temp }}/sc-wheel" .

      - name: Venv outside checkout
        shell: bash
        run: |
          python -m venv "${{ runner.temp }}/sc-smoke"
          if [ -x "${{ runner.temp }}/sc-smoke/Scripts/python.exe" ]; then
            PY="${{ runner.temp }}/sc-smoke/Scripts/python.exe"
          else
            PY="${{ runner.temp }}/sc-smoke/bin/python"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install "${{ runner.temp }}/sc-wheel/"*.whl

      - name: Smoke wheel
        shell: bash
        run: |
          unset PYTHONPATH
          if [ -x "${{ runner.temp }}/sc-smoke/Scripts/python.exe" ]; then
            PY="${{ runner.temp }}/sc-smoke/Scripts/python.exe"
          else
            PY="${{ runner.temp }}/sc-smoke/bin/python"
          fi
          python scripts/smoke_wheel.py --python "$PY" --cwd "${{ runner.temp }}/sc-cwd"
