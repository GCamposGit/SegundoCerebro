name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Q1: ruff config is in pyproject.toml. Without this job two agents on
  # two machines lint with whatever they have installed, and the noqas
  # become cargo cult.
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install ruff
        # Pin matches [project.optional-dependencies] dev. Do not float.
        run: pip install ruff==0.16.5
      - name: ruff check
        run: python -m ruff check src tests eval

  types:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package from lock
        # FND-09b: types used to resolve pyproject ranges. Lock first, then
        # the editable package without resolving again. pyright pin matches extra.
        run: pip install -r requirements-dev.txt ; pip install -e . --no-deps
      - name: pyright
        run: python -m pyright src
      - name: pyright frontier fixtures
        run: python -m pytest tests/test_tipos_fronteira.py -q

  pytest:
    # The hosted Windows runner delivers CTRL_C to this process (KeyboardInterrupt
    # at random frames after ~20s). That is not an assertion failure. The suite
    # is portable; Windows install stays proven by install-smoke.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package from lock
        # FND-09b: runtime+dev lock, then the editable package without
        # resolving again. pytest-cov comes from the lock, not a floating pip.
        run: pip install -r requirements-dev.txt ; pip install -e . --no-deps

      - name: Run test suite
        # Floor is measured, then −2 p.p. (Q1). Do not raise it toward 100.
        run: python -m pytest tests/ eval/ -q --cov=segundocerebro --cov-report=xml --cov-fail-under=80

  # FND-09b: layperson path. Ranges from pyproject, no lock. A third-party
  # release that breaks import is a product defect. GPU extra stays out —
  # a CUDA machine must not rewrite the CPU default.
  resolve-open:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install from pyproject ranges
        run: pip install -e .
      - name: Import surfaces without the dev extra
        run: python -c "import segundocerebro; from segundocerebro.mcp.server import main as mcp_main; from segundocerebro.painel import app as painel_app; from segundocerebro.index.indexer import main as idx_main; from segundocerebro.index.diagnostico import main as diag_main"

  # FND-09a: the layperson path is the wheel, not `pip install -e .`.
  # Full pytest stays on Windows. This job builds a wheel, installs it in a
  # venv outside the checkout, and runs scripts/smoke_wheel.py.
  install-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Build wheel
        run: python -m pip wheel --no-deps -w "${{ runner.temp }}/sc-wheel" .

      - name: Venv outside checkout
        shell: bash
        run: |
          python -m venv "${{ runner.temp }}/sc-smoke"
          if [ -x "${{ runner.temp }}/sc-smoke/Scripts/python.exe" ]; then
            PY="${{ runner.temp }}/sc-smoke/Scripts/python.exe"
          else
            PY="${{ runner.temp }}/sc-smoke/bin/python"
          fi
          "$PY" -m pip install --upgrade pip
          # Unix validates the portable wheel surface; Windows exercises the
          # full runtime because native dependencies are platform-specific.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            "$PY" -m pip install "${{ runner.temp }}/sc-wheel/"*.whl
          else
            "$PY" -m pip install --no-deps "${{ runner.temp }}/sc-wheel/"*.whl
          fi

      - name: Smoke wheel
        shell: bash
        run: |
          unset PYTHONPATH
          if [ -x "${{ runner.temp }}/sc-smoke/Scripts/python.exe" ]; then
            PY="${{ runner.temp }}/sc-smoke/Scripts/python.exe"
          else
            PY="${{ runner.temp }}/sc-smoke/bin/python"
          fi
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            python scripts/smoke_wheel.py --python "$PY" --cwd "${{ runner.temp }}/sc-cwd"
          else
            python scripts/smoke_wheel.py --python "$PY" --cwd "${{ runner.temp }}/sc-cwd" --sem-runtime
          fi
