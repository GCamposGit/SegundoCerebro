name: Dark Factory Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package from lock
        run: pip install -r requirements-dev.txt ; pip install -e . --no-deps
      - name: Run deterministic harness
        run: python core/harness/runner.py --quick

