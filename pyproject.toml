[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segundocerebro"
version = "0.0.1"
description = "Servidor MCP de recuperação sobre base de conhecimento pessoal e corporativa"
requires-python = ">=3.12"
# Q2: pyproject is the only declared source. requirements.txt is the lock
# generated from this list (pip-compile). A floating extra that swapped ORT
# for CUDA 13 dropped 45 indexer tests on this desktop — pin, don't clean.
dependencies = [
    # F0 — census uses the stdlib. pytest is the suite, declared because tests import it.
    "pytest>=8.0",
    # F1 — ingest. An embedding version swap invalidates the whole index
    # without warning (fastembed 0.8.0 changed e5-large pooling CLS→mean).
    "pymupdf==1.28.2",
    "pymupdf4llm==1.28.2",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "xlrd==1.2.0",
    "fastembed==0.8.0",
    # Vector index. Was commented until 17/08/2026 and only worked because
    # someone had installed it by hand — a hitchhiker is a missing dep on a
    # clean machine.
    "lancedb==0.37.1",
    # Hitchhiker of fastembed; embeddings.py and store.py import it directly.
    "numpy>=2.0,<3",
    "mcp>=2.0,<3",
    # F4-W — disk watcher. Separate process; not in the indexer loop.
    "watchdog==6.0.0",
    # F3.5 — panel. starlette/uvicorn already come with mcp; the panel imports
    # them directly, so they are declared. The panel stays optional at runtime
    # (invariant 6): without these the MCP server still serves.
    "starlette>=1.0,<2",
    "uvicorn>=0.30",
    "tomli-w>=1.0",
    # Starlette test client (tests/test_painel.py). Same hitchhiker argument.
    "httpx>=0.27",
    # OLE compound (CFB). olefile is one pure-Python module and does not
    # change model_id.
    "olefile==0.47",
    # Scanned PDFs. Not an extra: a layperson's folder of ofícios cannot
    # silently index as empty. `pip install -e .` must OCR.
    "rapidocr-onnxruntime>=1.3,<2",
]

[project.optional-dependencies]
# Q2: this extra is the pin. CUDA 13 (ORT >= 1.27) and cuDNN 9 (ORT >= 1.19)
# are refused by tests/test_gpu_extra.py — they dropped 45 indexer tests on
# Maxwell. numpy<2 stays in requirements-gpu.txt: pip extras are a union and
# the CPU pin is numpy>=2. Overlay: pip uninstall onnxruntime ;
# pip install -r requirements-gpu.txt. See docs/smoke-cuda.md.
gpu = [
    "onnxruntime-gpu==1.18.0",
    "nvidia-cuda-runtime-cu11==11.8.89",
    "nvidia-cublas-cu11==11.11.3.6",
    "nvidia-cudnn-cu11==8.9.5.29",
    "nvidia-cuda-nvrtc-cu11==11.8.89",
    "nvidia-cufft-cu11==10.9.0.58",
    "nvidia-curand-cu11==10.3.0.86",
]
# Alias of the main RapidOCR pin, for installs that still pass `[ocr]`.
ocr = [
    "rapidocr-onnxruntime>=1.3,<2",
]
# Q1: lint, types, coverage. The pytest job on CI installs the lock, then
# the editable package with --no-deps. ruff/pyright jobs install only what
# they need.
dev = [
    "ruff==0.16.5",
    "pyright==1.1.411",
    "pytest-cov>=5,<8",
    # Q2 — regenerate the lock:
    #   pip-compile --strip-extras --output-file=requirements.txt pyproject.toml
    "pip-tools>=7.4,<8",
]

[project.scripts]
segundocerebro-censo = "segundocerebro.census:main"
segundocerebro-mcp = "segundocerebro.mcp.server:main"
segundocerebro-painel = "segundocerebro.painel.__main__:main"
segundocerebro-indexar = "segundocerebro.index.indexer:main"
segundocerebro-observar = "segundocerebro.index.watcher:main"
segundocerebro-exportar = "segundocerebro.acesso.exportar:main"
segundocerebro-diagnosticar = "segundocerebro.index.diagnostico:main"
segundocerebro-backup = "segundocerebro.index.backup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
segundocerebro = ["painel/index.html"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "eval"]
addopts = "-ra -m 'not modelo and not cuda and not ocr and not arquivo'"
markers = [
  # Carregam o encoder de verdade: ~2 GB de download na primeira vez e dezenas de
  # segundos por rodada. Ficam fora do padrão, mas são obrigatórios antes de
  # qualquer indexação — é a classe de teste que teria pego a truncagem silenciosa.
  #     py -m pytest -m modelo
  "modelo: exige baixar e carregar o modelo de embedding real",
  "cuda: exige GPU e onnxruntime-gpu — fora da suíte padrão e do CI",
  # Motor RapidOCR real. Fora da suíte padrão (baixa pesos, ~20 s).
  #     py -m pytest -m ocr
  "ocr: motor RapidOCR real — fora da suíte padrão e do CI",
  # Instrumento de pacote **encerrado** (`eval/arquivo/`). Continua reproduzível,
  # mas não guarda nenhuma decisão aberta — e o que não guarda decisão aberta não
  # precisa custar leitura, lint e CI a cada passada.
  #     py -m pytest -m arquivo
  "arquivo: instrumento de pacote encerrado — fora da suíte padrão",
]

# Q1 — lint. Select is the subset that passes today without growing noqa
# (ANN/BLE/S stay as existing suppressions, not as CI rules). E501 is line
# length: ruff format would rewrite 136 files, including retrieve/ and the
# indexer loop, so format --check is a dedicated PR, not this one.
# E741 (`l` as loop variable), E702 (semicolon in the generator) and E401
# (multi-import) are style of files this package does not reformat.
[tool.ruff]
target-version = "py312"
src = ["src", "tests", "eval"]
line-length = 100

[tool.ruff.lint]
# `BLE`, `S603` e `DTZ` entraram em 29/08/2026, e o motivo não é gosto: com
# `select = ["E","F"]` os 352 `# noqa` do repositório não suprimiam **nada** —
# `ruff --select RUF100` os lista um a um. Era o culto à carga que o próprio
# `Q1` avisou que aconteceria. `BLE` custou zero erro e deu sentido a 77 deles;
# `S603` custou cinco `noqa` com motivo escrito, que é o que o `Q4` pede.
#
# A escada, medida no mesmo dia sobre `src tests eval`, para quem for subir mais:
#   RET 3 · DTZ 3 (feito) · B 17 · SIM 25 · I 49 · C901 29 · ARG001 42 ·
#   ANN202 45 · ANN201 193 · ANN001 359
# `I` e `ruff format` são PR próprio: reescrevem import de 49 arquivos e o corpo
# de 136, e um diff desse tamanho apaga `git blame` das docstrings de decisão.
select = ["E", "F", "BLE", "S603", "DTZ"]
ignore = ["E501", "E741", "E702", "E401"]

[tool.ruff.lint.per-file-ignores]
# Notebook-owned ranking. Unused import is not a ranking change; Q1 does
# not rewrite retrieve/* to satisfy F401.
"src/segundocerebro/retrieve/**" = ["F401"]

# Q1 — types. basic, with the report codes that currently fire turned off
# so the job is a gate rather than a 50-error wall. Re-enable module by
# module; the list is the ladder, not a waiver.
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src"]
reportMissingImports = "none"
reportArgumentType = "none"
reportCallIssue = "none"
reportAttributeAccessIssue = "none"
reportReturnType = "none"
reportOptionalMemberAccess = "none"
reportOptionalCall = "none"
reportGeneralTypeIssues = "none"
