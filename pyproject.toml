[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segundocerebro"
version = "0.0.1"
description = "Servidor MCP de recuperação sobre base de conhecimento pessoal e corporativa"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
# CUDA 11.8 + cuDNN 8, for Maxwell (sm_52). numpy<2 stays in
# requirements-gpu.txt — it contradicts the CPU pin, and the install
# procedure is still: pip install -e . ; pip uninstall onnxruntime ;
# pip install -r requirements-gpu.txt. See docs/smoke-cuda.md.
gpu = [
    "onnxruntime-gpu==1.18.0",
    "nvidia-cuda-runtime-cu11==11.8.89",
    "nvidia-cublas-cu11==11.11.3.6",
    "nvidia-cudnn-cu11==8.9.5.29",
    "nvidia-cuda-nvrtc-cu11==11.8.89",
    "nvidia-cufft-cu11==10.9.0.58",
    "nvidia-curand-cu11==10.3.0.86",
]
# RapidOCR (ONNX). Default install does not OCR; `indexar --ocr` is a no-op
# without this extra. Tesseract is a fallback if the binary is on PATH.
ocr = [
    "rapidocr-onnxruntime>=1.3,<2",
]

[project.scripts]
segundocerebro-censo = "segundocerebro.census:main"
segundocerebro-mcp = "segundocerebro.mcp.server:main"
segundocerebro-painel = "segundocerebro.painel.__main__:main"
segundocerebro-indexar = "segundocerebro.index.indexer:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
segundocerebro = ["painel/index.html"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "eval"]
addopts = "-ra -m 'not modelo and not cuda and not ocr'"
markers = [
  # Carregam o encoder de verdade: ~2 GB de download na primeira vez e dezenas de
  # segundos por rodada. Ficam fora do padrão, mas são obrigatórios antes de
  # qualquer indexação — é a classe de teste que teria pego a truncagem silenciosa.
  #     py -m pytest -m modelo
  "modelo: exige baixar e carregar o modelo de embedding real",
  "cuda: exige GPU e onnxruntime-gpu — fora da suíte padrão e do CI",
  # Extra [ocr] (RapidOCR). The default suite stays identical without it.
  #     py -m pytest -m ocr
  "ocr: exige extra [ocr] (RapidOCR) — fora da suíte padrão e do CI",
]
